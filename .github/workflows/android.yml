name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate ephemeral CI-only upload key
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/notiflow-ci-only.jks" \
            -storepass "ci-build-only" -keypass "ci-build-only" \
            -alias ciOnly -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=NotiFlow CI Only,O=Test Builds,C=US"

      - name: Verify build and release bundle (CI-only certificate)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/notiflow-ci-only.jks
          KEYSTORE_PASSWORD: ci-build-only
          KEY_ALIAS: ciOnly
          KEY_PASSWORD: ci-build-only
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --stacktrace

      - name: Verify release bundle is never debug signed
        shell: bash
        run: |
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/release-cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/release-cert.txt"; then
            echo "Release bundle unexpectedly uses Android Debug signing" >&2
            exit 1
          fi

  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
