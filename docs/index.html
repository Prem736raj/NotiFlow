<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotiFlow - Privacy-First Android Notification Inbox</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --heading-color: #f0f6fc;
            --accent-color: #38bdf8;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 40px 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-align: center;
        }
        h1 {
            color: var(--heading-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        p {
            font-size: 1.1rem;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #0d1117;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-secondary {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>NotiFlow</h1>
    <p>Privacy-first Android notification inbox with offline rules, expense tracking, focus modes, voice reader, and anti-revoke.</p>
    <div class="btn-group">
        <a class="btn" href="privacy-policy">Privacy Policy</a>
        <a class="btn btn-secondary" href="https://github.com/prem736raj/NotiFlow">GitHub Repository</a>
    </div>
</div>
</body>
</html>
